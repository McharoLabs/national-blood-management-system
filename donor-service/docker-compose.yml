version: '3.9'

services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgresql/data:/var/lib/postgresql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8089:8080
