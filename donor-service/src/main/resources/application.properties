spring.application.name=donor-service

spring.datasource.url=jdbc:postgresql://localhost:5432/donor_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8083

server.servlet.context-path=/api/v1/donors

jwt.public.key.path=file:/home/mcharo/projects/certs/public.pem

eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka

# Resilience4j Circuit Breaker Properties
resilience4j.circuitbreaker.instances.donor.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.donor.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.donor.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.donor.slidingWindowSize=100
resilience4j.circuitbreaker.instances.donor.failureRateThreshold=50
resilience4j.circuitbreaker.instances.donor.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.donor.permittedNumberOfCallsInHalfOpenState=10
resilience4j.circuitbreaker.instances.donor.automaticTransitionFromOpenToHalfOpenEnabled=true

# Resilience4j Timeout Properties
resilience4j.timelimiter.instances.donor.timeout-duration=3s

# Resilience4j Retry Properties
resilience4j.retry.instances.donor.max-attempts=3
resilience4j.retry.instances.donor.wait-duration=5s


# Kafka Bootstrap Server
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=\
donorNotification:com.nbts.management.donor_service.event.DonorNotificationEvent,\
donorAuth:com.nbts.management.donor_service.event.DonorAuthCreatedEvent


# Consumer configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Allow this specific package to be deserialized
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nbts.management.donor_service.event

# Type mapping for this specific event
spring.kafka.consumer.properties.spring.json.type.mapping=\
donorAuth:com.nbts.management.donor_service.event.DonorAuthCreatedEvent


# Kafka Template
spring.kafka.template.default-topic=notification
spring.kafka.consumer.group-id=donor-service-group
